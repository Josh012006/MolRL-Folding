[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molrl-folding"
version = "0.1.0"
description = "Reinforcement learning for DNA origami staple design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["gymnasium>=1.0", "numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
